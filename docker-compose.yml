services:
  kryon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kryon-app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      ENVIRONMENT: "production"
    volumes:
      - ./data/raw:/app/data/raw
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
